[project]
site_name = "Notes for DevOps"
site_description = "Конспекты по Linux, сетям, базам данных, виртуализации и MikroTik"
site_author = "Anton Kulakevich"
site_url = "https://lastharbor.github.io/mkdocs-notes/"
copyright = "Copyright &copy; Anton Kulakevich"

repo_name = "lastharbor/mkdocs-notes"
repo_url = "https://github.com/lastharbor/mkdocs-notes"
edit_uri = "edit/main/docs/"

nav = [
  { "Главная" = "index.md" },
  { "Linux" = [
    "linux/index.md",
    { "Пользователи, группы и права" = "linux/users-permissions.md" },
    { "SSH" = "linux/ssh.md" },
    { "Мониторинг системы" = "linux/monitoring.md" },
    { "Процессы и потоки вывода" = "linux/processes.md" },
    { "Планировщик Cron" = "linux/cron.md" },
    { "Скрипты Bash" = "linux/bash-scripting.md" },
    { "Архивы и обработка текста" = "linux/text-tools.md" },
    { "Systemd и инициализация" = "linux/systemd.md" },
    { "Файловая система и диски" = "linux/filesystem.md" },
    { "Межпроцессное взаимодействие" = "linux/ipc.md" },
    { "Лицензии и deb-пакеты" = "linux/packages-licenses.md" },
    { "VIM" = "linux/vim.md" },
  ] },
  { "Сети" = [
    "networking/index.md",
    { "IP, DNS и HTTP" = "networking/ip-dns-www.md" },
    { "Стек TCP/IP" = "networking/tcp-ip.md" },
  ] },
  { "Базы данных" = [
    "databases/index.md",
    { "Реляционные БД" = "databases/relational.md" },
    { "Нереляционные БД" = "databases/nosql.md" },
    { "Резервное копирование" = "databases/backup.md" },
  ] },
  { "Виртуализация" = [
    "virtualization/index.md",
    { "Proxmox" = "virtualization/proxmox.md" },
  ] },
  { "Скрипты" = [
    "scripts/index.md",
    { "CHR на Proxmox" = "scripts/chr-proxmox.md" },
    { "WOL через Telegram-бота" = "scripts/telegram-wol.md" },
    { "Статическая DNS-запись" = "scripts/static-dns.md" },
  ] },
  { "Ссылки" = "resources/links.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "ru"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/server"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Переключить на светлую тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Переключить на тёмную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Переключить на системную тему"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lastharbor"
name = "lastharbor на GitHub"

[project.plugins.glightbox]

[project.plugins.redirects.redirect_maps]
"About.md" = "index.md"
"Dev Ops Basics/DevOps.md" = "linux/index.md"
"Dev Ops Basics/Proxmox.md" = "virtualization/proxmox.md"
"Scripts/CHR-Script.md" = "scripts/chr-proxmox.md"
"Scripts/WOLMikrotik.md" = "scripts/telegram-wol.md"
"Scripts/Static DNS mikrotik.md" = "scripts/static-dns.md"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "docs"
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

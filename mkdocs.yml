site_name: Notes for DevOps
site_description: Конспекты по Linux, сетям, базам данных, виртуализации и MikroTik
site_author: Anton Kulakevich
site_url: https://lastharbor.github.io/mkdocs-notes/
copyright: Copyright &copy; Anton Kulakevich

repo_name: lastharbor/mkdocs-notes
repo_url: https://github.com/lastharbor/mkdocs-notes
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ru
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      lang: ru
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: false
  - git-revision-date-localized:
      enable_git_follow: false
      type: date
      locale: ru
      fallback_to_build_date: true
  - redirects:
      redirect_maps:
        About.md: index.md
        Dev Ops Basics/DevOps.md: linux/index.md
        Dev Ops Basics/Proxmox.md: virtualization/proxmox.md
        Scripts/CHR-Script.md: scripts/chr-proxmox.md
        Scripts/WOLMikrotik.md: scripts/telegram-wol.md
        Scripts/Static DNS mikrotik.md: scripts/static-dns.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lastharbor
      name: lastharbor на GitHub

nav:
  - Главная: index.md
  - Linux:
      - linux/index.md
      - Пользователи, группы и права: linux/users-permissions.md
      - SSH: linux/ssh.md
      - Мониторинг системы: linux/monitoring.md
      - Процессы и потоки вывода: linux/processes.md
      - Планировщик Cron: linux/cron.md
      - Скрипты Bash: linux/bash-scripting.md
      - Архивы и обработка текста: linux/text-tools.md
      - Systemd и инициализация: linux/systemd.md
      - Файловая система и диски: linux/filesystem.md
      - Межпроцессное взаимодействие: linux/ipc.md
      - Лицензии и deb-пакеты: linux/packages-licenses.md
      - VIM: linux/vim.md
  - Сети:
      - networking/index.md
      - IP, DNS и HTTP: networking/ip-dns-www.md
      - Стек TCP/IP: networking/tcp-ip.md
  - Базы данных:
      - databases/index.md
      - Реляционные БД: databases/relational.md
      - Нереляционные БД: databases/nosql.md
      - Резервное копирование: databases/backup.md
  - Виртуализация:
      - virtualization/index.md
      - Proxmox: virtualization/proxmox.md
  - Скрипты:
      - scripts/index.md
      - CHR на Proxmox: scripts/chr-proxmox.md
      - WOL через Telegram-бота: scripts/telegram-wol.md
      - Статическая DNS-запись: scripts/static-dns.md
  - Ссылки: resources/links.md
